<!doctype html>
<html lang="en">
<head>
    <title>Products Display</title>
</head>
<body>
    <h1>Our Products</h1>

    <!-- التحقق من وجود رسالة خطأ -->
    {% if error %}
        <h2>{{ error }}</h2>
    
    <!-- إذا لم يكن هناك خطأ، نعرض الجدول -->
    {% else %}
        <table border="1">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <!-- حلقة تكرارية للمرور على كل منتج في القائمة -->
                {% for product in products %}
                <tr>
                    <td>{{ product.name }}</td>
                    <td>{{ product.category }}</td>
                    <td>{{ product.price }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% endif %}

</body>
</html>
